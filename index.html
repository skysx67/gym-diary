<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<title>Дневник зала</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0A1628; --surface:#12213A; --surface-2:#1A2C49;
    --text:#FFFFFF; --text-dim:#8C97AC;
    --accent:#2E7DF7; --accent-press:#256AD6;
    --border:#22304F; --danger:#E5484D;
    --radius:14px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.35;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:14px 16px 6px;flex:0 0 auto;}
  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.01em;}
  .sync{margin-top:2px;font-size:12px;color:var(--text-dim);min-height:15px;}
  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  section[hidden]{display:none;}

  /* Лента дней */
  .date-strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .date-strip::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;width:52px;padding:8px 0;border-radius:14px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:1px;
    cursor:pointer;touch-action:manipulation;transition:background-color .12s,color .12s,border-color .12s;
  }
  .pill-wd{font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  .pill-day{font-size:18px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .pill-dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px;}
  .pill-dot.on{background:var(--accent);}
  .pill.today{border-color:var(--accent);}
  .pill.sel{background:var(--accent);border-color:transparent;}
  .pill.sel .pill-wd,.pill.sel .pill-day{color:#fff;}
  .pill.sel .pill-dot.on{background:#fff;}

  /* Карточка дня */
  .day-card{padding:8px 16px 16px;}
  .day-title{font-size:16px;font-weight:700;margin:4px 0 12px;}
  .wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .wk-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-weight:800;color:var(--accent);}
  .wk-actions{display:flex;gap:4px;flex:0 0 auto;}
  .linkbtn{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px;}
  .linkbtn:active{background:var(--surface-2);}
  .linkbtn.danger{color:var(--danger);}

  .empty{color:var(--text-dim);text-align:center;font-size:14px;padding:20px 12px;}

  /* Карточка упражнения (логирование) */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;}
  .ex-name{font-size:17px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--border);overflow-wrap:anywhere;}
  .row{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap;}
  .field{display:flex;align-items:center;gap:6px;}
  .field label{color:var(--text-dim);font-size:13px;}
  .num{
    width:64px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-size:16px;padding:8px;text-align:center;outline:none;
    font-variant-numeric:tabular-nums;touch-action:manipulation;
  }
  .num:focus{border-color:var(--accent);}
  .stepper{display:flex;align-items:center;gap:8px;}
  .step-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;
  }
  .step-btn:active{background:var(--accent);}
  .step-count{min-width:20px;text-align:center;font-weight:700;}
  .sets-label{color:var(--text-dim);font-size:13px;margin-top:12px;}
  .sets{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .set{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:78px;}
  .set span{color:var(--text-dim);font-size:12px;}
  .set .num{width:56px;}
  .setw-add{
    align-self:stretch;background:none;border:1px dashed var(--border);border-radius:8px;
    color:var(--text-dim);font-size:11px;padding:7px 4px;cursor:pointer;
  }
  .setw-add:active{border-color:var(--accent);color:var(--accent);}
  .setw{display:flex;align-items:center;gap:2px;}
  .setw .num{width:52px;padding:6px;font-size:14px;}
  .setw-x{
    flex:0 0 auto;width:24px;height:24px;border:none;background:none;color:var(--text-dim);
    font-size:13px;line-height:1;cursor:pointer;border-radius:6px;
  }
  .setw-x:active{background:var(--surface-2);color:var(--danger);}
  .prevhint{color:var(--text-dim);font-size:12px;margin-top:10px;}
  .prevnote{
    margin-top:10px;padding:10px 11px;border:1px solid rgba(46,125,247,.45);border-radius:10px;
    background:rgba(46,125,247,.10);color:var(--text);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .prevnote-label{display:block;color:#72A8FF;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .note-wrap{margin-top:10px;}
  .note-add{padding-left:0;color:var(--accent);}
  .note-label{display:block;color:var(--text-dim);font-size:12px;margin-bottom:6px;}
  .note-input{
    display:block;width:100%;min-height:64px;max-height:160px;resize:none;overflow-y:auto;
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);
    font:inherit;font-size:14px;line-height:1.4;padding:9px 10px;outline:none;
  }
  .note-input::placeholder{color:var(--text-dim);}
  .note-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(46,125,247,.18);}

  /* Кнопки */
  .btn-primary{
    background:var(--accent);border:none;border-radius:var(--radius);color:#fff;
    font-size:15px;font-weight:700;padding:14px;cursor:pointer;width:100%;
  }
  .btn-primary:active{background:var(--accent-press);}
  .btn-ghost{
    background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
    color:var(--accent);font-size:15px;font-weight:600;padding:14px;cursor:pointer;width:100%;
  }

  /* Вкладка «Тренировки» */
  .tab-pad{padding:12px 16px 16px;}
  .wk-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;}
  .wk-block-head{display:flex;align-items:center;gap:8px;}
  .txt{
    flex:1;min-width:0;background:transparent;border:none;border-bottom:1px solid var(--border);
    color:var(--text);font-size:16px;padding:6px 2px 8px;outline:none;
  }
  .txt:focus{border-bottom-color:var(--accent);}
  .txt::placeholder{color:var(--text-dim);}
  .wk-title{font-weight:800;font-size:17px;}
  .ex-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .icon-btn{
    flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-dim);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn.danger{color:var(--danger);}
  .mini-add{background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;padding:10px 2px 2px;}
  .mini-row{display:flex;gap:14px;flex-wrap:wrap;}
  .icon-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* Суперсеты */
  .ss-badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);}
  .ss-group{border:1px solid var(--accent);border-radius:var(--radius);background:rgba(46,125,247,.06);padding:10px 10px 0;margin-bottom:12px;}
  .ss-group>.ss-badge{margin-bottom:8px;}
  .ss-group .card{margin-bottom:10px;}
  .ss-edit{border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:rgba(46,125,247,.06);padding:8px 8px 10px 10px;margin-top:10px;}
  .ss-edit .ex-row{margin-top:8px;}
  .ss-edit>.ss-badge{display:block;}

  /* Нижняя навигация */
  #tabbar{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;background:none;border:none;color:var(--text-dim);font-size:12px;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  .tab .ic{font-size:20px;}
  .tab.active{color:var(--accent);}

  /* Статистика */
  .seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:12px;}
  .seg-btn{flex:1;background:none;border:none;color:var(--text-dim);font-size:14px;font-weight:600;padding:9px 0;border-radius:9px;cursor:pointer;}
  .seg-btn.on{background:var(--accent);color:#fff;}
  .sel-native{width:100%;background-color:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:15px;margin-bottom:12px;}
  .stat-tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .stat{flex:1;min-width:92px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .stat-l{color:var(--text-dim);font-size:12px;}
  .stat-v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
  .stat.good .stat-v{color:#2FBF71;}
  .stat.bad .stat-v{color:var(--danger);}
  .chart-title{font-size:15px;font-weight:800;margin:2px 0 8px;}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 10px;margin-bottom:14px;}
  .chart-card svg{display:block;}
  .hist-title{color:var(--text-dim);font-size:13px;margin-bottom:6px;}
  .hist{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow-y:auto;overscroll-behavior:contain;}
  .hist-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:9px 11px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
  .hist-d{flex:0 0 auto;}
  .hist-v{text-align:right;min-width:0;}
  .hist-w{font-variant-numeric:tabular-nums;font-weight:700;}
  .hist-r{color:var(--text-dim);font-size:13px;font-variant-numeric:tabular-nums;margin-left:7px;overflow-wrap:anywhere;}

  /* Модалка выбора тренировки */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:50;}
  .modal[hidden]{display:none;}
  .sheet{background:var(--surface);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;overscroll-behavior:contain;}
  .sheet h3{margin:0 0 12px;font-size:17px;}
  .pick-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);margin-bottom:8px;cursor:pointer;}
  .pick-row .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pick-row .c{color:var(--text-dim);font-size:13px;flex:0 0 auto;}
  .sheet-note{color:var(--text-dim);font-size:13px;margin-bottom:10px;}
  .sheet-err{color:var(--danger);font-size:13px;min-height:16px;margin-bottom:8px;}
  .codebox{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
    color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
    padding:10px;margin-bottom:10px;resize:none;outline:none;word-break:break-all;
  }
  .codebox:focus{border-color:var(--accent);}
  .imp-list{margin-top:10px;}
  .imp-ex{padding:8px 2px;border-bottom:1px solid var(--border);font-size:15px;overflow-wrap:anywhere;}
  .imp-list .ss-edit .imp-ex:last-child{border-bottom:none;}

  button{touch-action:manipulation;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .pill:hover,.pick-row:hover{filter:brightness(1.12);}
  .linkbtn:hover,.mini-add:hover,.btn-ghost:hover{filter:brightness(1.15);}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Дневник зала <span aria-hidden="true">🏋️</span></h1>
    <div id="sync" class="sync" aria-live="polite"></div>
  </header>

  <main>
    <section id="tab-calendar">
      <div id="dateStrip" class="date-strip"></div>
      <div id="dayCard" class="day-card"></div>
    </section>
    <section id="tab-workouts" hidden>
      <div id="workoutsTab" class="tab-pad"></div>
    </section>
    <section id="tab-stats" hidden>
      <div id="statsTab" class="tab-pad"></div>
    </section>
  </main>

  <nav id="tabbar">
    <button class="tab active" data-tab="calendar"><span class="ic" aria-hidden="true">📅</span>Календарь</button>
    <button class="tab" data-tab="workouts"><span class="ic" aria-hidden="true">🏋️</span>Тренировки</button>
    <button class="tab" data-tab="stats"><span class="ic" aria-hidden="true">📈</span>Статистика</button>
  </nav>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  var inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");

  var STORAGE_KEY = "gymDiary.v3";
  var BACKUP_KEY  = "gymDiary.v3.bak";

  var WD_SHORT  = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
  var WD_FULL   = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
  var MON_GEN   = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var MON_SHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

  // ---------- Утилиты ----------
  function uid(){
    if(window.crypto && crypto.randomUUID){ try{ return crypto.randomUUID(); }catch(e){} }
    return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  }
  function pad2(n){ return n<10 ? "0"+n : ""+n; }
  function iso(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function parseISO(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function todayISO(){ return iso(new Date()); }
  function addDaysISO(s, n){ var d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
  function fmtDayTitle(s){ var d=parseISO(s); return WD_FULL[d.getDay()]+", "+d.getDate()+" "+MON_GEN[d.getMonth()]; }
  function fmtShort(s){ var d=parseISO(s); return d.getDate()+" "+MON_SHORT[d.getMonth()]; }

  // Вес часто вводят через запятую («42,5»), а parseFloat такое молча режет до 42 —
  // поэтому свой разбор. Показываем тоже с запятой, без лишних нулей.
  function num(v){
    if(v == null) return null;
    var n = parseFloat(String(v).replace(",", "."));
    return isNaN(n) ? null : n;
  }
  function round1(n){ return Math.round(n*10)/10; }
  function fmtNum(n){ return String(round1(n)).replace(".", ","); }

  function el(tag, attrs, kids){
    var n = document.createElement(tag); attrs = attrs || {};
    for(var k in attrs){
      if(!Object.prototype.hasOwnProperty.call(attrs,k)) continue;
      var v = attrs[k]; if(v == null) continue;
      if(k === "class") n.className = v;
      else if(k === "value") n.value = v;
      else if(k.slice(0,2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    if(kids != null){
      if(!Array.isArray(kids)) kids = [kids];
      for(var i=0;i<kids.length;i++){
        var kid = kids[i]; if(kid == null || kid === false) continue;
        n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
      }
    }
    return n;
  }
  // ---------- Обмен тренировками (код) ----------
  // Сервера нет (Pages отдаёт статику), поэтому программа кодируется в текст и передаётся
  // любым способом. Формат: строка "1", название, дальше упражнения с префиксом
  // "-" (обычное) или "+" (в суперсете с предыдущим). Всё это в base64url.
  var BOT_LINK = "https://t.me/dnevnik_spuchenka_bot";
  var MAX_NAME = 80, MAX_EX = 60;

  function b64urlEncode(str){
    var bytes = new TextEncoder().encode(str), bin = "";
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function b64urlDecode(s){
    s = s.replace(/-/g,"+").replace(/_/g,"/");
    while(s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function encodeWorkout(wk){
    var lines = ["1", (wk.name || "Тренировка").slice(0, MAX_NAME)];
    wk.exercises.forEach(function(e, i){
      var linked = i > 0 && e.ss && wk.exercises[i-1].ss === e.ss;
      lines.push((linked ? "+" : "-") + (e.name || "").slice(0, MAX_NAME));
    });
    return b64urlEncode(lines.join("\n"));
  }
  function decodeWorkout(code){
    var txt;
    try{ txt = b64urlDecode(String(code).trim().replace(/\s+/g,"")); }catch(e){ return null; }
    var lines = txt.split("\n");
    if(lines[0] !== "1" || lines.length < 3) return null;
    var exs = [];
    for(var i=2; i<lines.length && exs.length < MAX_EX; i++){
      var l = lines[i], c = l.charAt(0);
      if(c !== "+" && c !== "-") return null;
      var ex = { id: uid(), name: l.slice(1, MAX_NAME+1), ss: null };   // id всегда новые
      if(c === "+" && exs.length){
        var prev = exs[exs.length-1];
        if(!prev.ss) prev.ss = uid();
        ex.ss = prev.ss;
      }
      exs.push(ex);
    }
    if(!exs.length) return null;
    return { id: uid(), name: lines[1].slice(0, MAX_NAME), exercises: exs };
  }

  function confirmAction(msg, cb){
    if(inTelegram && tg.showConfirm){
      try{ tg.showConfirm(msg, function(ok){ if(ok) cb(); }); return; }catch(e){}
    }
    if(window.confirm(msg)) cb();
  }

  // ---------- Данные ----------
  function emptyState(){ return { workouts:[], workoutsAt:0, sessions:{}, ui:{ selectedDate: todayISO(), statsMode:"exercise", statsSel:null } }; }

  function normTime(v){ return (typeof v === "number" && isFinite(v) && v > 0) ? v : 0; }
  function normExList(arr){
    if(!Array.isArray(arr)) return [];
    return arr.map(function(e){
      if(!e || typeof e !== "object") return null;
      // ss — id группы суперсета: подряд идущие упражнения с одним ss = один суперсет
      return { id: e.id || uid(), name: typeof e.name === "string" ? e.name : "", ss: (typeof e.ss === "string" && e.ss) ? e.ss : null };
    }).filter(Boolean);
  }
  function normWorkout(w){
    if(!w || typeof w !== "object") return null;
    return { id: w.id || uid(), name: typeof w.name === "string" ? w.name : "", exercises: normExList(w.exercises) };
  }
  function normEntry(en){
    if(!en || typeof en !== "object") return null;
    var reps = Array.isArray(en.reps) ? en.reps.map(function(r){ return r==null ? "" : String(r); }) : ["","",""];
    if(reps.length === 0) reps = [""];
    // wts[i]: null — у подхода нет своего веса (берётся общий), строка — свой вес подхода
    var wts = Array.isArray(en.wts) ? en.wts.map(function(w){ return w==null ? null : String(w); }) : [];
    while(wts.length < reps.length) wts.push(null);
    wts.length = reps.length;
    return {
      weight: en.weight==null ? "" : String(en.weight),
      reps: reps,
      wts: wts,
      note: typeof en.note === "string" ? en.note.slice(0,240) : ""
    };
  }
  function normSession(s){
    if(!s || typeof s !== "object") return null;
    var out = { workoutId: s.workoutId || null, at: normTime(s.at), exercises: normExList(s.exercises), entries: {} };
    if(s.entries && typeof s.entries === "object"){
      for(var id in s.entries){
        if(!Object.prototype.hasOwnProperty.call(s.entries,id)) continue;
        var ne = normEntry(s.entries[id]); if(ne) out.entries[id] = ne;
      }
    }
    return out;
  }
  function normalize(data){
    var base = emptyState();
    if(data && Array.isArray(data.workouts)) base.workouts = data.workouts.map(normWorkout).filter(Boolean);
    if(data) base.workoutsAt = normTime(data.workoutsAt);
    if(data && data.sessions && typeof data.sessions === "object"){
      for(var date in data.sessions){
        if(!Object.prototype.hasOwnProperty.call(data.sessions,date)) continue;
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
        var ns = normSession(data.sessions[date]); if(ns) base.sessions[date] = ns;
      }
    }
    return base; // ui не восстанавливаем — всегда стартуем с сегодня
  }

  function hasContent(s){
    if(!s) return false;
    if(s.workouts && s.workouts.length) return true;
    for(var d in s.sessions){ if(Object.prototype.hasOwnProperty.call(s.sessions,d)) return true; }
    return false;
  }
  function readLocal(key){
    try{ var raw = localStorage.getItem(key); if(!raw) return null; return normalize(JSON.parse(raw)); }
    catch(e){ return null; }
  }
  var restoredFromBackup = false;
  function load(){
    var main = readLocal(STORAGE_KEY);
    if(hasContent(main)) return main;
    var bak = readLocal(BACKUP_KEY);      // страховка: основной ключ пуст или битый — поднимаем копию
    if(hasContent(bak)){ restoredFromBackup = true; return bak; }
    return main || emptyState();
  }
  function saveLocal(){
    try{
      var json = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, json);
      if(hasContent(state)) localStorage.setItem(BACKUP_KEY, json);  // копию пустотой не затираем
    }catch(e){}
  }

  // ---------- Синхронизация (CloudStorage, по ключу на день) ----------
  // workouts -> ключ "workouts"; каждая сессия -> ключ "s_YYYY-MM-DD".
  // ВАЖНО: Telegram разрешает в ключах только A-Z a-z 0-9 _ - . Ключ с любым другим символом
  // (например с двоеточием) клиент молча отбрасывает и НЕ вызывает колбэк — поэтому charset
  // проверяем сами, а на каждую пачку операций вешаем watchdog.
  var KEY_RE = /^[A-Za-z0-9_-]{1,128}$/;
  var CLOUD_TIMEOUT = 12000, MAX_RETRY = 3;
  var cloudReady = false, cloudTimer = null, cloudBusy = false, retryLeft = MAX_RETRY;
  var dirty = { workouts:false, sessions:{}, removed:{} };

  function sessionKey(date){ return "s_" + date; }
  function dateFromKey(k){
    if(k.length === 12 && (k.indexOf("s_") === 0 || k.indexOf("s:") === 0)){  // "s:" — legacy
      var d = k.slice(2); if(/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
    }
    return null;
  }

  function persist(){ retryLeft = MAX_RETRY; saveLocal(); if(cloudReady) scheduleCloudSave(); }
  function markWorkouts(){ dirty.workouts = true; state.workoutsAt = Date.now(); persist(); }
  function markSession(date){
    if(state.sessions[date]) state.sessions[date].at = Date.now();
    dirty.sessions[date] = true; if(dirty.removed[date]) delete dirty.removed[date];
    persist();
  }
  function markRemoved(date){ dirty.removed[date] = true; if(dirty.sessions[date]) delete dirty.sessions[date]; persist(); }

  function cloudAvailable(){ return !!(inTelegram && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")); }
  function dirtyEmpty(){
    if(dirty.workouts) return false;
    for(var a in dirty.sessions) return false;
    for(var b in dirty.removed) return false;
    return true;
  }

  function cloudSaveNow(){
    if(cloudTimer){ clearTimeout(cloudTimer); cloudTimer = null; }
    if(!cloudAvailable()) return;
    if(cloudBusy){ scheduleCloudSave(); return; }          // предыдущая пачка ещё летит
    if(dirtyEmpty()){ setSyncStatus("ok"); return; }

    var ops = [], d, r;
    if(dirty.workouts) ops.push({ t:"set", key:"workouts", val:JSON.stringify({ at: state.workoutsAt, items: state.workouts }), w:true });
    for(d in dirty.sessions){ if(state.sessions[d]) ops.push({ t:"set", key:sessionKey(d), val:JSON.stringify(state.sessions[d]), date:d }); }
    for(r in dirty.removed){ ops.push({ t:"rm", key:sessionKey(r), date:r, rm:true }); }
    dirty = { workouts:false, sessions:{}, removed:{} };

    ops = ops.filter(function(o){ return KEY_RE.test(o.key); });   // невалидный ключ = гарантированный молчаливый провал
    if(ops.length === 0){ setSyncStatus("ok"); return; }

    setSyncStatus("saving");
    cloudBusy = true;
    var pending = ops.length, failed = false, finished = false;
    var wd = setTimeout(function(){ finish(true); }, CLOUD_TIMEOUT);

    function requeue(o){
      if(o.w) dirty.workouts = true;
      else if(o.rm) dirty.removed[o.date] = true;
      else dirty.sessions[o.date] = true;
    }
    function finish(timedOut){
      if(finished) return; finished = true;
      clearTimeout(wd); cloudBusy = false;
      if(timedOut){ ops.forEach(function(o){ if(!o.done) requeue(o); }); }
      if(failed || timedOut){
        setSyncStatus("error");
        if(retryLeft > 0){ retryLeft--; cloudTimer = setTimeout(cloudSaveNow, 5000); }
      } else {
        retryLeft = MAX_RETRY;
        setSyncStatus(dirtyEmpty() ? "ok" : "saving");
        if(!dirtyEmpty()) scheduleCloudSave();
      }
    }
    ops.forEach(function(o){
      function done(err, ok){
        if(o.done) return;
        o.done = true;
        if(err || ok === false){ failed = true; requeue(o); }
        if(--pending === 0) finish(false);
      }
      try{
        if(o.t === "set") tg.CloudStorage.setItem(o.key, o.val, done);
        else tg.CloudStorage.removeItem(o.key, done);
      }catch(e){ done(e || true); }
    });
  }
  function scheduleCloudSave(){
    if(!cloudAvailable()) return;
    setSyncStatus("saving");
    if(cloudTimer) clearTimeout(cloudTimer);
    cloudTimer = setTimeout(cloudSaveNow, 700);
  }
  function getItemsChunked(keys, cb){
    var out = {}, i = 0, done = false;
    var wd = setTimeout(function(){ if(!done){ done = true; cb(out, true); } }, CLOUD_TIMEOUT);
    (function next(){
      if(done) return;
      if(i >= keys.length){ done = true; clearTimeout(wd); cb(out, false); return; }
      var chunk = keys.slice(i, i+50); i += 50;
      try{
        tg.CloudStorage.getItems(chunk, function(err, vals){
          if(!err && vals){ for(var k in vals){ out[k] = vals[k]; } }
          next();
        });
      }catch(e){ if(!done){ done = true; clearTimeout(wd); cb(out, true); } }
    })();
  }
  function pushAllToCloud(){
    dirty.workouts = true;
    for(var d in state.sessions){ dirty.sessions[d] = true; }
    cloudSaveNow();
  }

  // Слияние локального и облачного состояния. Побеждает более свежая версия (метка at),
  // при равных метках — та, где заполнено больше упражнений. Ничего не удаляем «в одну сторону».
  function filledCount(s){ var n = 0; for(var id in s.entries){ if(hasData(s.entries[id])) n++; } return n; }
  function mergeCloud(cs){
    var pushDates = {}, pushWorkouts = false, d;

    if(cs.workouts.length && cs.workoutsAt >= state.workoutsAt){
      state.workouts = cs.workouts; state.workoutsAt = cs.workoutsAt;
    } else if(state.workouts.length || state.workoutsAt){
      pushWorkouts = true;                                   // локальные свежее — зальём наверх
    } else if(cs.workouts.length){
      state.workouts = cs.workouts; state.workoutsAt = cs.workoutsAt;
    }

    for(d in cs.sessions){
      var c = cs.sessions[d], l = state.sessions[d];
      if(!l){ state.sessions[d] = c; continue; }
      var cloudWins = (c.at !== l.at) ? (c.at > l.at) : (filledCount(c) > filledCount(l));
      if(cloudWins) state.sessions[d] = c; else pushDates[d] = true;
    }
    for(d in state.sessions){ if(!(d in cs.sessions)) pushDates[d] = true; }

    if(pushWorkouts) dirty.workouts = true;
    for(var p in pushDates) dirty.sessions[p] = true;
  }

  function initCloud(){
    if(!cloudAvailable()){ setSyncStatus("local"); return; }
    setSyncStatus("loading");
    var settled = false;
    function bail(){                                          // облако не ответило — работаем локально
      if(settled) return; settled = true;
      cloudReady = true; setSyncStatus("error");
    }
    var guard = setTimeout(bail, CLOUD_TIMEOUT);
    try{
      tg.CloudStorage.getKeys(function(err, keys){
        if(settled) return;
        clearTimeout(guard);
        if(err || !keys){ settled = true; cloudReady = true; pushAllToCloud(); return; }
        var wanted = keys.filter(function(k){ return k === "workouts" || dateFromKey(k) !== null; });
        if(wanted.length === 0){ settled = true; cloudReady = true; pushAllToCloud(); return; }
        getItemsChunked(wanted, function(values, timedOut){
          if(settled) return; settled = true;
          var raw = { workouts: [], workoutsAt: 0, sessions: {} };
          if(values.workouts){
            try{
              var pw = JSON.parse(values.workouts);
              if(Array.isArray(pw)) raw.workouts = pw;                                    // старый формат
              else if(pw && Array.isArray(pw.items)){ raw.workouts = pw.items; raw.workoutsAt = pw.at; }
            }catch(e){}
          }
          for(var k in values){
            var dt = dateFromKey(k);
            if(dt && values[k]){ try{ raw.sessions[dt] = JSON.parse(values[k]); }catch(e){} }
          }
          mergeCloud(normalize(raw));
          saveLocal();
          cloudReady = true;
          renderAll();
          if(timedOut){ setSyncStatus("error"); return; }
          if(dirtyEmpty()) setSyncStatus("ok"); else cloudSaveNow();
        });
      });
    }catch(e){ clearTimeout(guard); settled = true; setSyncStatus("local"); }
  }

  var state = load();
  if(restoredFromBackup) saveLocal();   // сразу чиним повреждённый основной ключ

  // ---------- Доступ к данным ----------
  function findWorkout(id){ for(var i=0;i<state.workouts.length;i++){ if(state.workouts[i].id===id) return state.workouts[i]; } return null; }
  function hasData(entry){
    if(!entry) return false;
    if(entry.weight !== "") return true;
    if(entry.reps.some(function(r){ return r !== ""; })) return true;
    if((entry.wts || []).some(function(w){ return w != null && w !== ""; })) return true;
    return typeof entry.note === "string" && entry.note.trim() !== "";
  }
  // вес конкретного подхода: свой, если задан, иначе общий
  function setWeight(entry, si){
    var w = entry.wts ? entry.wts[si] : null;
    return (w != null && w !== "") ? w : entry.weight;
  }
  // «рабочий» вес упражнения за день — максимальный из общего и весов подходов
  function topWeight(entry){
    var best = num(entry.weight);
    (entry.wts || []).forEach(function(x){
      var v = num(x);
      if(v !== null && (best === null || v > best)) best = v;
    });
    return best;
  }
  function totalReps(entry){
    var t = 0, any = false;
    (entry.reps || []).forEach(function(r){ var n = num(r); if(n !== null){ t += n; any = true; } });
    return any ? t : null;
  }
  function variedWeights(entry){
    return (entry.wts || []).some(function(w){ return w != null && w !== "" && w !== entry.weight; });
  }
  // повторения: «12/10/9», а если вес гулял по подходам — парами «12×40 / 10×44»
  function repsDetail(entry){
    if(variedWeights(entry)){
      return entry.reps.map(function(r, i){
        var w = setWeight(entry, i);
        return (r !== "" ? r : "—") + (w ? "×"+w : "");
      }).join(" / ");
    }
    return entry.reps.filter(function(r){ return r !== ""; }).join("/");
  }
  // то же плюс вес — для подсказки «прошлый раз»
  function entrySummary(entry){
    var d = repsDetail(entry);
    if(variedWeights(entry)) return d;
    return (entry.weight ? entry.weight+" кг" : "—") + (d ? " · "+d : "");
  }
  function sessionHasData(s){ if(!s) return false; for(var id in s.entries){ if(hasData(s.entries[id])) return true; } return false; }

  var materialized = false;   // при рендере дня появились новые записи (перенос веса) — их надо сохранить
  function ensureEntry(session, exId){
    if(!session.entries[exId]){
      var prev = nearestPrevEntry(state.ui.selectedDate, exId);
      session.entries[exId] = prev
        ? { weight: prev.entry.weight, reps: prev.entry.reps.map(function(){ return ""; }), wts: prev.entry.wts.slice(), note:"" }
        : { weight:"", reps:["","",""], wts:[null,null,null], note:"" };
      materialized = true;
    }
    return session.entries[exId];
  }

  // Подряд идущие упражнения с одинаковым ss — один суперсет. Возвращает отрезки [from,to).
  function ssRuns(list){
    var runs = [], i = 0;
    while(i < list.length){
      var g = list[i].ss;
      if(g){
        var j = i; while(j < list.length && list[j].ss === g) j++;
        if(j - i > 1){ runs.push({ ss:g, from:i, to:j }); i = j; continue; }
      }
      runs.push({ ss:null, from:i, to:i+1 }); i++;
    }
    return runs;
  }
  function cleanupSs(list){   // группа из одного упражнения — не суперсет
    var counts = {};
    list.forEach(function(e){ if(e.ss) counts[e.ss] = (counts[e.ss]||0) + 1; });
    list.forEach(function(e){ if(e.ss && counts[e.ss] < 2) e.ss = null; });
  }
  // ближайшая ранняя по дате сессия с осмысленной записью по этому упражнению
  function nearestPrevEntry(date, exId){
    var dates = [];
    for(var d in state.sessions){
      if(d < date && state.sessions[d].entries[exId] && hasData(state.sessions[d].entries[exId])) dates.push(d);
    }
    if(!dates.length) return null;
    dates.sort();
    var last = dates[dates.length-1];
    return { date: last, entry: state.sessions[last].entries[exId] };
  }

  // ---------- DOM ----------
  var stripEl     = document.getElementById("dateStrip");
  var dayCardEl   = document.getElementById("dayCard");
  var workoutsEl  = document.getElementById("workoutsTab");
  var statsEl     = document.getElementById("statsTab");
  var syncEl      = document.getElementById("sync");
  var modalEl     = document.getElementById("modal");
  var sheetEl     = document.getElementById("sheet");

  function setSyncStatus(s){
    if(!syncEl) return;
    var map = {
      loading:["☁ загрузка…","var(--text-dim)"], saving:["☁ сохранение…","var(--text-dim)"],
      ok:["☁ сохранено","var(--text-dim)"], error:["⚠ облако недоступно — сохранено на телефоне","var(--danger)"],
      local:["","var(--text-dim)"]
    };
    var v = map[s] || map.local; syncEl.textContent = v[0]; syncEl.style.color = v[1];
  }

  // ----- Лента дней -----
  var STRIP_BACK = 30, STRIP_FWD = 30;
  function renderStrip(center){
    stripEl.innerHTML = "";
    var today = todayISO(), sel = state.ui.selectedDate;
    var start = addDaysISO(today, -STRIP_BACK);
    for(var i=0; i<=STRIP_BACK+STRIP_FWD; i++){
      (function(date){
        var d = parseISO(date);
        var isToday = date === today, isSel = date === sel, hasS = !!state.sessions[date];
        var pill = el("button", {
          "class":"pill" + (isToday?" today":"") + (isSel?" sel":""),
          onclick:function(e){ selectDate(date, e.currentTarget); }
        }, [
          el("span",{"class":"pill-wd"}, WD_SHORT[d.getDay()]),
          el("span",{"class":"pill-day"}, String(d.getDate())),
          el("span",{"class":"pill-dot"+(hasS?" on":"")})
        ]);
        stripEl.appendChild(pill);
      })(addDaysISO(start, i));
    }
    if(center !== false){
      requestAnimationFrame(function(){
        var s = stripEl.querySelector(".pill.sel") || stripEl.querySelector(".pill.today");
        if(s) stripEl.scrollLeft = s.offsetLeft - (stripEl.clientWidth - s.offsetWidth)/2;
      });
    }
  }
  function selectDate(date, pillEl){
    state.ui.selectedDate = date;
    var prev = stripEl.querySelector(".pill.sel"); if(prev) prev.classList.remove("sel");
    if(pillEl) pillEl.classList.add("sel");
    renderDayCard();
  }

  // ----- Карточка упражнения (логирование) -----
  function makeLogCard(session, ex){
    var entry = ensureEntry(session, ex.id);
    var prev = nearestPrevEntry(state.ui.selectedDate, ex.id);

    var weightInput = el("input", {
      "class":"num", type:"text", inputmode:"decimal", "aria-label":"Вес в килограммах", autocomplete:"off",
      placeholder:(prev && prev.entry.weight) ? prev.entry.weight : "—", value: entry.weight,
      oninput:function(e){ entry.weight = e.target.value; markSession(state.ui.selectedDate); }
    });
    var stepCount = el("span", {"class":"step-count"}, String(entry.reps.length));
    var minus = el("button", {"class":"step-btn", "aria-label":"Убрать подход", onclick:function(){
      if(entry.reps.length>1){ entry.reps.pop(); entry.wts.pop(); markSession(state.ui.selectedDate); renderDayCard(); }
    }}, "−");
    var plus = el("button", {"class":"step-btn", "aria-label":"Добавить подход", onclick:function(){
      entry.reps.push(""); entry.wts.push(null); markSession(state.ui.selectedDate); renderDayCard();
    }}, "+");

    // Свой вес подхода: «＋ вес» подставляет общий вес, дальше правишь цифру. ✕ — вернуть общий.
    function weightSlot(si){
      var slot = el("div", {"class":"setw-slot"});
      function draw(focusIt){
        slot.innerHTML = "";
        if(entry.wts[si] == null){
          slot.appendChild(el("button", {"class":"setw-add", "aria-label":"Задать свой вес для подхода "+(si+1), onclick:function(){
            entry.wts[si] = weightInput.value || "";
            markSession(state.ui.selectedDate); draw(true);
          }}, "＋ вес"));
          return;
        }
        var ph = (prev && prev.entry.wts && prev.entry.wts[si] != null && prev.entry.wts[si] !== "") ? prev.entry.wts[si] : (entry.weight || "—");
        var inp = el("input", {
          "class":"num", type:"text", inputmode:"decimal", autocomplete:"off",
          "aria-label":"Вес подхода "+(si+1)+", кг", placeholder: ph, value: entry.wts[si],
          oninput:function(e){ entry.wts[si] = e.target.value; markSession(state.ui.selectedDate); }
        });
        slot.appendChild(el("div", {"class":"setw"}, [
          inp,
          el("button", {"class":"setw-x", "aria-label":"Убрать свой вес подхода "+(si+1), title:"Вернуть общий вес", onclick:function(){
            entry.wts[si] = null; markSession(state.ui.selectedDate); draw(false);
          }}, "✕")
        ]));
        if(focusIt){ inp.focus(); try{ inp.select(); }catch(e){} }
      }
      draw(false);
      return slot;
    }

    var setsWrap = el("div", {"class":"sets"});
    entry.reps.forEach(function(rep, si){
      (function(si){
        var ph = (prev && prev.entry.reps[si]!=null && prev.entry.reps[si]!=="") ? prev.entry.reps[si] : "—";
        setsWrap.appendChild(el("div", {"class":"set"}, [
          el("span", {}, "Подход "+(si+1)),
          el("input", { "class":"num", type:"text", inputmode:"numeric", "aria-label":"Повторения, подход "+(si+1), autocomplete:"off", placeholder: ph, value: rep,
            oninput:function(e){ entry.reps[si] = e.target.value; markSession(state.ui.selectedDate); } }),
          weightSlot(si)
        ]));
      })(si);
    });

    // Заметка остаётся в текущей сессии и показывается как подсказка на следующей.
    // В новую запись её не копируем — пользователь пишет отдельную заметку после каждого раза.
    var noteOpen = !!entry.note;
    var noteWrap = el("div", {"class":"note-wrap"});
    function drawNote(focusIt){
      noteWrap.innerHTML = "";
      if(!noteOpen && !entry.note){
        noteWrap.appendChild(el("button", {"class":"linkbtn note-add", onclick:function(){
          noteOpen = true; drawNote(true);
        }}, "＋ Заметка на следующий раз"));
        return;
      }
      var noteInput = el("textarea", {
        "class":"note-input", rows:"2", maxlength:"240", autocomplete:"off",
        "aria-label":"Заметка к упражнению на следующую тренировку",
        placeholder:"Например: повысить вес на 2,5 кг…", value:entry.note,
        oninput:function(e){
          entry.note = e.target.value.slice(0,240);
          e.target.style.height = "auto";
          e.target.style.height = Math.min(e.target.scrollHeight,160) + "px";
          markSession(state.ui.selectedDate);
        }
      });
      noteWrap.appendChild(el("label", {"class":"note-label"}, "Заметка на следующий раз"));
      noteWrap.appendChild(noteInput);
      requestAnimationFrame(function(){
        noteInput.style.height = "auto";
        noteInput.style.height = Math.min(noteInput.scrollHeight,160) + "px";
        if(focusIt) noteInput.focus();
      });
    }
    drawNote(false);

    var kids = [ el("div", {"class":"ex-name"}, ex.name || "Без названия") ];
    if(prev && prev.entry.note && prev.entry.note.trim()){
      kids.push(el("div", {"class":"prevnote"}, [
        el("span", {"class":"prevnote-label"}, "Заметка с прошлого раза"),
        document.createTextNode(prev.entry.note.trim())
      ]));
    }
    kids.push(
      el("div", {"class":"row"}, [
        el("div", {"class":"field"}, [ el("label", {}, "Вес, кг"), weightInput ]),
        el("div", {"class":"field"}, [ el("label", {}, "Подходы"), el("div", {"class":"stepper"}, [ minus, stepCount, plus ]) ])
      ]),
      el("div", {"class":"sets-label"}, "Повторения по подходам:"),
      setsWrap,
      noteWrap
    );
    if(prev && (topWeight(prev.entry) !== null || totalReps(prev.entry) !== null)){
      kids.push(el("div", {"class":"prevhint"}, "Прошлый раз (" + fmtShort(prev.date) + "): " + entrySummary(prev.entry)));
    }
    return el("div", {"class":"card"}, kids);
  }

  // ----- Карточка дня -----
  function renderDayCard(){
    dayCardEl.innerHTML = "";
    materialized = false;
    var date = state.ui.selectedDate;
    dayCardEl.appendChild(el("div", {"class":"day-title"}, fmtDayTitle(date)));

    var session = state.sessions[date];
    if(!session){
      dayCardEl.appendChild(el("div", {"class":"empty"}, "На этот день тренировка не выбрана."));
      dayCardEl.appendChild(el("button", {"class":"btn-primary", onclick:function(){ openPicker(date); }}, "Выбрать тренировку"));
      return;
    }

    var wk = findWorkout(session.workoutId);
    // сегодня и будущее подтягивают актуальный состав шаблона (правки состава/суперсетов видны сразу);
    // прошлые дни остаются снимком. Цифры привязаны к id упражнения, поэтому не теряются.
    if(wk && date >= todayISO()){
      var snap = snapshotExercises(wk);
      if(JSON.stringify(snap) !== JSON.stringify(session.exercises)){ session.exercises = snap; markSession(date); }
    }
    dayCardEl.appendChild(el("div", {"class":"wk-head"}, [
      el("div", {"class":"wk-name"}, (wk && wk.name) ? wk.name : "Тренировка"),
      el("div", {"class":"wk-actions"}, [
        el("button", {"class":"linkbtn", onclick:function(){ openPicker(date); }}, "Сменить"),
        el("button", {"class":"linkbtn danger", onclick:function(){
          confirmAction("Убрать тренировку с этого дня?", function(){
            delete state.sessions[date]; markRemoved(date); renderStrip(false); renderDayCard();
          });
        }}, "Убрать")
      ])
    ]));

    if(session.exercises.length === 0){
      dayCardEl.appendChild(el("div", {"class":"empty"}, "В этой тренировке нет упражнений. Добавь их во вкладке «Тренировки»."));
    } else {
      ssRuns(session.exercises).forEach(function(r){
        var target = dayCardEl;
        if(r.ss){
          target = el("div", {"class":"ss-group"}, el("div", {"class":"ss-badge"}, "🔗 Суперсет"));
          dayCardEl.appendChild(target);
        }
        for(var i=r.from;i<r.to;i++){ target.appendChild(makeLogCard(session, session.exercises[i])); }
      });
    }
    if(materialized) markSession(date); // перенесённые веса надо сохранить
  }

  // ----- Поделиться тренировкой / добавить по коду -----
  function copyToClipboard(text, field, btn, okLabel, defLabel){
    function ok(){ btn.textContent = okLabel; setTimeout(function(){ btn.textContent = defLabel; }, 1800); }
    function fallback(){
      try{ field.focus(); field.setSelectionRange(0, field.value.length); document.execCommand("copy"); ok(); }
      catch(e){ btn.textContent = "Выдели код выше и скопируй"; }
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); return; }
    }catch(e){}
    fallback();
  }
  function openShare(wk){

      var field = el("textarea", {"class":"codebox", readonly:"readonly", rows:"3", "aria-label":"Код тренировки"});
      field.value = code;

      s.appendChild(field);
      var copyBtn = el("button", {"class":"btn-primary", onclick:function(){

          try{ tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(BOT_LINK) + "&text=" + encodeURIComponent(msg)); }catch(e){}

  // ----- Модалка выбора тренировки -----

      s.appendChild(el("h3", {}, state.sessions[date] ? "Сменить тренировку" : "Выбор тренировки"));
      if(state.workouts.length === 0){

  function snapshotExercises(wk){ return wk.exercises.map(function(e){ return { id:e.id, name:e.name, ss:e.ss||null }; }); }
  function assignWorkout(date, wk){
    function doAssign(){
      var keepEntries = (state.sessions[date] && state.sessions[date].entries) ? state.sessions[date].entries : {};
      state.sessions[date] = {
        workoutId: wk.id, at: 0,
        exercises: snapshotExercises(wk),
        entries: keepEntries
      };
      markSession(date); closeSheet(); renderStrip(false); renderDayCard();
    }
    if(sessionHasData(state.sessions[date])){
      confirmAction("Заменить тренировку этого дня? Введённые цифры останутся только для совпадающих упражнений.", doAssign);
    } else doAssign();
  }

  // ----- Вкладка «Тренировки» -----
  function createWorkout(){
    state.workouts.push({ id: uid(), name:"", exercises:[] });
    markWorkouts(); renderWorkouts();
    var names = workoutsEl.querySelectorAll(".wk-title");
    if(names.length) names[names.length-1].focus();
  }
  function linkAt(list, i){            // объединить упражнение с предыдущим (и всю его группу)
    var target = list[i-1].ss || uid();
    list[i-1].ss = target;
    var old = list[i].ss;
    if(old){ for(var j=i; j<list.length && list[j].ss===old; j++) list[j].ss = target; }
    else list[i].ss = target;
    cleanupSs(list);
  }
  function unlinkAt(list, i){          // отцепить от предыдущего: хвост группы уходит в новую группу
    var g = list[i].ss, ng = uid();
    for(var j=i; j<list.length && list[j].ss===g; j++) list[j].ss = ng;
    cleanupSs(list);
  }
  function isLinked(list, i){ return i > 0 && !!list[i].ss && list[i-1].ss === list[i].ss; }

  // renderWorkouts() пересобирает DOM, поэтому фокус ставим по свежим узлам нужного блока
  function focusInBlock(wi, sel, fromEnd){

    if(wi >= blocks.length) return;
    var rows = blocks[wi].querySelectorAll(sel);
    var idx = rows.length - 1 - (fromEnd || 0);
    if(idx >= 0) rows[idx].focus();
  }

  function renderWorkouts(){

        el("button", {"class":"icon-btn danger", "aria-label":"Удалить тренировку", title:"Удалить тренировку", onclick:function(){
          confirmAction("Удалить тренировку «"+(wk.name||"без названия")+"»? Уже записанные дни останутся в истории.", function(){

      ]);

        ];

            title: linked ? "Разъединить суперсет" : "Объединить с предыдущим в суперсет",

              if(linked) unlinkAt(wk.exercises, ei); else linkAt(wk.exercises, ei);
              markWorkouts(); renderWorkouts();
            }
          }, "🔗"));
        }
        kids.push(el("button", {"class":"icon-btn danger", "aria-label":"Удалить упражнение", title:"Удалить упражнение", onclick:function(){
          wk.exercises.splice(ei,1); cleanupSs(wk.exercises); markWorkouts(); renderWorkouts();
        }}, "✕"));

          block.appendChild(target);

      });

          focusInBlock(wi, ".ex-row .txt", 0);
        }}, "＋ упражнение"),
        el("button", {"class":"mini-add", onclick:function(){
          var g = uid();
          wk.exercises.push({ id: uid(), name:"", ss:g });
          wk.exercises.push({ id: uid(), name:"", ss:g });

          focusInBlock(wi, ".ex-row .txt", 1);

  // ----- Статистика -----
  var SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, kids){
    var n = document.createElementNS(SVGNS, tag);
    if(attrs){ for(var k in attrs){ if(attrs[k]!=null) n.setAttribute(k, attrs[k]); } }
    if(kids){ if(!Array.isArray(kids)) kids=[kids]; for(var i=0;i<kids.length;i++){ var c=kids[i]; if(c) n.appendChild(typeof c==="string"?document.createTextNode(c):c); } }
    return n;
  }
  function mean(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
  function median(a){ var s=a.slice().sort(function(x,y){return x-y;}); var m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
  function fmtDayShortFull(d){ var x=parseISO(d); return WD_SHORT[x.getDay()]+", "+x.getDate()+" "+MON_SHORT[x.getMonth()]; }

  // по оси — рабочий вес: максимум из общего и весов отдельных подходов
  function exercisePoints(exId){
    var pts=[];
    Object.keys(state.sessions).sort().forEach(function(d){
      var e = state.sessions[d].entries[exId]; if(!e) return;
      var w = topWeight(e); if(w==null) return;
      pts.push({ date:d, y:w, reps: totalReps(e), text: repsDetail(e) });
    });
    return pts;
  }
  function workoutPoints(wid){
    var pts=[];
    Object.keys(state.sessions).sort().forEach(function(d){
      var s = state.sessions[d]; if(s.workoutId !== wid) return;
      var ws=[], reps=0, anyReps=false;
      for(var id in s.entries){
        var w = topWeight(s.entries[id]); if(w!=null) ws.push(w);
        var r = totalReps(s.entries[id]); if(r!==null){ reps += r; anyReps = true; }
      }
      if(ws.length) pts.push({
        date:d, y: round1(mean(ws)), median: round1(median(ws)),
        reps: anyReps ? reps : null, sets: ws.length
      });
    });
    return pts;
  }
  function exerciseOptions(){
    var map={};
    state.workouts.forEach(function(w){ w.exercises.forEach(function(e){ map[e.id]=e.name; }); });
    Object.keys(state.sessions).forEach(function(d){ state.sessions[d].exercises.forEach(function(e){ if(!(e.id in map)) map[e.id]=e.name; }); });
    return Object.keys(map).filter(function(id){ return exercisePoints(id).length>0; }).map(function(id){ return { id:id, name:map[id] }; });
  }
  function workoutOptions(){ return state.workouts.filter(function(w){ return workoutPoints(w.id).length>0; }).map(function(w){ return { id:w.id, name:w.name }; }); }
  function statOptions(){ return state.ui.statsMode==="workout" ? workoutOptions() : exerciseOptions(); }

  function statTile(label, val, tone){
    return el("div",{"class":"stat"+(tone?" "+tone:"")},[ el("div",{"class":"stat-l"},label), el("div",{"class":"stat-v"},val) ]);
  }

  function lineChart(points){
    var W=320,H=180,padL=34,padR=16,padT=18,padB=28, n=points.length;
    var ys=points.map(function(p){return p.y;});
    var yMax=Math.max.apply(null,ys), yMin=Math.min.apply(null,ys);
    if(yMax===yMin){ yMax+=1; yMin=Math.max(0,yMin-1); }
    var rng=yMax-yMin; yMax+=rng*0.12; yMin-=rng*0.12; if(yMin<0) yMin=0;
    // на узком диапазоне (напр. 40…44) целые подписи врут — показываем с десятыми,
    // под них нужно левое поле пошире
    var fine = (yMax - yMin) < 10;
    if(fine) padL = 46;
    function X(i){ return n===1 ? (padL+(W-padL-padR)/2) : padL + i*(W-padL-padR)/(n-1); }
    function Y(v){ return padT + (1-(v-yMin)/(yMax-yMin))*(H-padT-padB); }

    var svg=sv("svg",{viewBox:"0 0 "+W+" "+H, width:"100%", role:"img", "aria-label":"График веса по датам", preserveAspectRatio:"xMidYMid meet"});
    svg.appendChild(sv("defs",{}, sv("linearGradient",{id:"garea",x1:"0",y1:"0",x2:"0",y2:"1"},[
      sv("stop",{offset:"0%","stop-color":"#2E7DF7","stop-opacity":"0.35"}),
      sv("stop",{offset:"100%","stop-color":"#2E7DF7","stop-opacity":"0"})
    ])));
    for(var g=0; g<=2; g++){
      var v=yMin+(yMax-yMin)*g/2, yy=Y(v);
      svg.appendChild(sv("line",{x1:padL,y1:yy,x2:W-padR,y2:yy,stroke:"#22304F","stroke-width":"1"}));
      svg.appendChild(sv("text",{x:padL-6,y:yy+3,"text-anchor":"end","font-size":"10",fill:"#8C97AC"}, fine ? fmtNum(v) : String(Math.round(v))));
    }
    if(n>1){
      var dA="M "+X(0)+" "+Y(points[0].y);
      points.forEach(function(p,i){ dA+=" L "+X(i)+" "+Y(p.y); });
      dA+=" L "+X(n-1)+" "+(H-padB)+" L "+X(0)+" "+(H-padB)+" Z";
      svg.appendChild(sv("path",{d:dA,fill:"url(#garea)"}));
      var dL="M "+X(0)+" "+Y(points[0].y);
      points.forEach(function(p,i){ if(i) dL+=" L "+X(i)+" "+Y(p.y); });
      svg.appendChild(sv("path",{d:dL,fill:"none",stroke:"#2E7DF7","stroke-width":"2","stroke-linejoin":"round","stroke-linecap":"round"}));
    }
    var every=Math.ceil(n/6);
    points.forEach(function(p,i){
      svg.appendChild(sv("circle",{cx:X(i),cy:Y(p.y),r:"3.5",fill:"#2E7DF7",stroke:"#12213A","stroke-width":"2"}));
      if(i===0 || i===n-1 || i%every===0) svg.appendChild(sv("text",{x:X(i),y:H-padB+15,"text-anchor":"middle","font-size":"9",fill:"#8C97AC"}, fmtShort(p.date)));
    });
    var last=points[n-1];
    svg.appendChild(sv("text",{x:X(n-1),y:Y(last.y)-8,"text-anchor": n===1?"middle":"end","font-size":"11","font-weight":"700",fill:"#FFFFFF"}, fmtNum(last.y)));
    return svg;
  }

  function renderStats(){
    statsEl.innerHTML="";
    var isWk = state.ui.statsMode==="workout";
    statsEl.appendChild(el("div",{"class":"seg"},[
      el("button",{"class":"seg-btn"+(!isWk?" on":""), onclick:function(){ state.ui.statsMode="exercise"; state.ui.statsSel=null; renderStats(); }},"По упражнению"),
      el("button",{"class":"seg-btn"+(isWk?" on":""), onclick:function(){ state.ui.statsMode="workout"; state.ui.statsSel=null; renderStats(); }},"По тренировке")
    ]));

    var opts=statOptions();
    if(opts.length===0){
      statsEl.appendChild(el("div",{"class":"empty"}, "Пока нет данных для графика. Залогируй тренировки с весом — здесь появится прогресс."));
      return;
    }
    if(!state.ui.statsSel || !opts.some(function(o){return o.id===state.ui.statsSel;})) state.ui.statsSel=opts[0].id;

    var select=el("select",{"class":"sel-native","aria-label":isWk?"Выбор тренировки":"Выбор упражнения", onchange:function(e){ state.ui.statsSel=e.target.value; renderStats(); }});
    opts.forEach(function(o){ select.appendChild(el("option",{value:o.id}, o.name||"Без названия")); });
    select.value=state.ui.statsSel;
    statsEl.appendChild(select);

    var points = isWk ? workoutPoints(state.ui.statsSel) : exercisePoints(state.ui.statsSel);
    var lastPt=points[points.length-1];
    var ys=points.map(function(p){return p.y;});
    var last=ys[ys.length-1], first=ys[0], max=Math.max.apply(null,ys);
    var delta=round1(last-first);

    var tiles=el("div",{"class":"stat-tiles"},[
      statTile(isWk?"Среднее (посл.)":"Последний", fmtNum(last)+" кг"),
      statTile("Максимум", fmtNum(max)+" кг"),
      statTile("Рост", (delta>0?"+":"")+fmtNum(delta)+" кг", delta>0?"good":(delta<0?"bad":""))
    ]);
    if(isWk) tiles.appendChild(statTile("Медиана (посл.)", fmtNum(lastPt.median)+" кг"));
    if(lastPt.reps !== null && lastPt.reps !== undefined){
      tiles.appendChild(statTile(isWk?"Повторений за тренировку":"Повторений (посл.)", fmtNum(lastPt.reps)));
    }
    statsEl.appendChild(tiles);

    var selName=(opts.filter(function(o){return o.id===state.ui.statsSel;})[0]||{}).name || "";
    statsEl.appendChild(el("div",{"class":"chart-card"},[ el("div",{"class":"chart-title"}, selName), lineChart(points) ]));

    var hist=el("div",{"class":"hist"});
    points.slice().reverse().forEach(function(p){
      // справа — вес и повторения: «42,5 кг · 12/10/9» (или пары «12×40 / 10×44»)
      var detail = isWk
        ? (p.reps !== null ? fmtNum(p.reps) + " повт." : "")
        : (p.text || "");
      hist.appendChild(el("div",{"class":"hist-row"},[
        el("span",{"class":"hist-d"}, fmtDayShortFull(p.date)),
        el("span",{"class":"hist-v"},[
          el("span",{"class":"hist-w"}, fmtNum(p.y)+" кг"),
          detail ? el("span",{"class":"hist-r"}, detail) : null
        ])
      ]));
    });
    statsEl.appendChild(el("div",{},[ el("div",{"class":"hist-title"},"История"), hist ]));
  }

  // ----- Вкладки -----
  function setTab(name){
    document.getElementById("tab-calendar").hidden = (name !== "calendar");
    document.getElementById("tab-workouts").hidden = (name !== "workouts");
    document.getElementById("tab-stats").hidden = (name !== "stats");
    var tabs = document.querySelectorAll("#tabbar .tab");
    for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle("active", tabs[i].getAttribute("data-tab") === name); }
    if(name === "workouts") renderWorkouts();
    else if(name === "stats") renderStats();
    else { renderStrip(); renderDayCard(); }
  }

  function renderAll(){ renderStrip(); renderDayCard(); renderWorkouts(); renderStats(); }

  // ----- Инициализация -----
  var tabButtons = document.querySelectorAll("#tabbar .tab");
  for(var t=0;t<tabButtons.length;t++){
    (function(btn){ btn.addEventListener("click", function(){ setTab(btn.getAttribute("data-tab")); }); })(tabButtons[t]);
  }

  // тап по пустому месту (не по полю/кнопке) — снять фокус и закрыть числовую клавиатуру
  document.addEventListener("pointerdown", function(e){
    var a = document.activeElement;
    if(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")){
      var t = e.target;
      if(!(t.closest && t.closest("input, textarea, button"))) a.blur();
    }
  });

  if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

  renderAll();
  initCloud();

  // тренировка, пришедшая ссылкой t.me/<bot>?startapp=<код> (либо ?w=<код> в браузере)
  (function(){
    var code = null;
    try{
      if(tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) code = tg.initDataUnsafe.start_param;
      if(!code) code = new URLSearchParams(location.search).get("w");
    }catch(e){}
    if(!code) return;
    var wk = decodeWorkout(code);
    if(wk) openImportConfirm(wk);
  })();
})();
</script>
</body>
</html>
